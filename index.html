<script>
/* ===== ตัวเชื่อม Firebase: สมัครสมาชิก + ฐานข้อมูลกลาง (ไม่ต้องใช้ Claude/GitHub) =====
   members/{uid}: {name,email,role}  role = admin | teacher | viewer | pending
   ผู้สมัครคนแรก (ยังไม่มี meta/setup) = admin  คนถัดไป = pending รอผู้ดูแลอนุมัติ */
const FB = (() => {
  let auth = null, fs = null, user = null, member = null, started = false;
  const members = {}; let memSubs = [], memStarted = false, memReady = false;
  const assetUrls = {}, inflight = {};
  const FV = () => firebase.firestore.FieldValue;
  function cfg() {
    if (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG) return FIREBASE_CONFIG;
    try { return JSON.parse(localStorage.getItem('abdia_fbcfg') || 'null'); } catch (e) { return null; }
  }
  const configured = () => { const c = cfg(); return !!(c && c.apiKey && c.projectId); };
  function startMembers() {
    if (memStarted) return; memStarted = true;
    fs.collection('members').onSnapshot((s) => {
      Object.keys(members).forEach((k) => delete members[k]);
      s.docs.forEach((d) => { members[d.id] = Object.assign({ id: d.id }, d.data()); });
      memReady = true; memSubs.forEach((f) => { try { f(); } catch (e) { console.warn(e); } });
    }, (e) => console.warn('members', e));
  }
  const memberList = () => Object.keys(members).map((k) => members[k]).sort((a, b) => ((a.name || a.email || '').localeCompare(b.name || b.email || '', 'th')));
  const conv = (o) => { const r = {}; for (const k in o) r[k] = o[k] === null ? FV().delete() : o[k]; return r; };
  function docRef(col, id) {
    if (col === 'teachers') return { set: () => Promise.resolve(), update: () => Promise.resolve(), delete: () => Promise.resolve() };
    const ref = fs.collection(col).doc(id);
    return {
      set: (d) => ref.set(d),
      update: (ch) => { const out = {}; for (const k in ch) out[k] = k === 'r' ? conv(ch.r) : (ch[k] === null ? FV().delete() : ch[k]); return ref.set(out, { merge: true }); },
      delete: () => ref.delete(),
    };
  }
  const DB = {
    collection(col) {
      return {
        doc: (id) => docRef(col, id),
        onSnapshot(ok, err) {
          if (col === 'teachers') {
            startMembers();
            const fire = () => ok({ docs: memberList().filter((m) => m.role === 'admin' || m.role === 'teacher').map((m) => ({ id: m.id, data: () => ({ id: m.id, name: m.name || '' }) })) });
            memSubs.push(fire); if (memReady) fire();
            return () => { memSubs = memSubs.filter((f) => f !== fire); };
          }
          return fs.collection(col).onSnapshot(ok, err);
        },
      };
    },
    doc(path) { const p = path.split('/'); return docRef(p[0], p[1]); },
  };
  const isAdmin = () => !!member && member.role === 'admin';
  const canWrite = () => !!member && (member.role === 'admin' || member.role === 'teacher');
  const userApi = {

    id: async () => user.uid, me: async () => ({ id: user.uid, name: (member && member.name) || user.displayName || (user.email || '').split('@')[0] }),
    profiles: async (ids) => { const o = {}; ids.forEach((i) => { o[i] = { name: (members[i] && members[i].name) || '' }; }); return o; },
  };
  /* ไฟล์แนบเก็บเป็นเอกสารใน Firestore (ไม่เกิน ~650 KB) */
  const b64 = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); });
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const assets = {
    async upload(file, o) {
      const id = rid(), type = file.type || (o && o.type) || 'application/octet-stream';
      try { await fs.collection('files').doc(id).set({ name: file.name || 'file', type, size: file.size, data: await b64(file) }); }
      catch (e) { throw { code: e && e.code === 'permission-denied' ? 'none' : 'fail', message: 'บัญชีนี้แนบไฟล์ไม่ได้ (ต้องเป็นผู้ดูแลหรือครูผู้สอน)' }; }
      assetUrls[id] = URL.createObjectURL(file);
      return { id, url: assetUrls[id], sizeBytes: file.size, contentType: type };
    },
    async delete(id) { try { await fs.collection('files').doc(id).delete(); } catch (e) { /* ignore */ } delete assetUrls[id]; },
  };
  function ensure(id) {
    if (!id) return Promise.resolve('');
    if (assetUrls[id]) return Promise.resolve(assetUrls[id]);
    if (!inflight[id]) inflight[id] = fs.collection('files').doc(id).get().then((d) => {
      delete inflight[id]; if (!d.exists) throw new Error('missing');
      const x = d.data(), bin = atob(x.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return (assetUrls[id] = URL.createObjectURL(new Blob([u], { type: x.type })));
    }, (e) => { delete inflight[id]; throw e; });
    return inflight[id];
  }
  const assetUrl = (id) => { if (!assetUrls[id]) { ensure(id).then(() => { if (typeof render === 'function' && typeof C !== 'undefined' && C.ready) render(); }).catch(() => {}); return ''; } return assetUrls[id]; };
  const downloads = {
    save({ filename, data }) {
      return new Promise((res, rej) => {
        try { const blob = data instanceof Blob ? data : new Blob([data]), u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); res(); } catch (e) { rej(e); }
      });
    },
  };
  function start(onUser) {
    if (started) return; started = true;
    const c = cfg();
    if (!firebase.apps.length) firebase.initializeApp(c);
    auth = firebase.auth(); fs = firebase.firestore();
    /* เครือข่ายโรงเรียน/พร็อกซีบางแห่งบล็อกการเชื่อมต่อแบบสตรีม ให้ลองแบบ long-polling อัตโนมัติ */

  async function ensureMember(u, nameHint) {

  }

    fs.collection('members').doc(user.uid).onSnapshot((d) => { if (d.exists && d.data().role !== 'pending') location.reload(); });
  }
  const signUp = async (name, email, pw) => { const r = await auth.createUserWithEmailAndPassword(email, pw); try { await r.user.updateProfile({ displayName: name }); } catch (e) { /* ignore */ } return r; };
  const signIn = (email, pw) => auth.signInWithEmailAndPassword(email, pw);
  const google = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  const reset = (email) => auth.sendPasswordResetEmail(email);
  const signOut = () => auth.signOut();
  const setRole = (uid, role) => fs.collection('members').doc(uid).update({ role });
  const setName = async (uid, name) => { await fs.collection('members').doc(uid).update({ name }); if (member && member.id === uid) member.name = name; };
  const removeMember = (uid) => fs.collection('members').doc(uid).delete();
  const onMembers = (f) => { startMembers(); memSubs.push(f); return () => { memSubs = memSubs.filter((x) => x !== f); }; };
  const authErr = (e) => {
    const c = (e && e.code) || '';
    return ({
      'auth/invalid-email': 'อีเมลไม่ถูกต้อง', 'auth/user-not-found': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'auth/wrong-password': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
      'auth/email-already-in-use': 'อีเมลนี้สมัครไว้แล้ว ให้กดเข้าสู่ระบบแทน', 'auth/weak-password': 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร', 'auth/missing-password': 'กรุณากรอกรหัสผ่าน',
      'auth/network-request-failed': 'ต่ออินเทอร์เน็ตไม่ได้ ลองใหม่อีกครั้ง', 'auth/too-many-requests': 'ลองหลายครั้งเกินไป รอสักครู่แล้วลองใหม่',
      'auth/popup-closed-by-user': 'ปิดหน้าต่าง Google ก่อนเสร็จ ลองอีกครั้ง', 'auth/popup-blocked': 'เบราว์เซอร์บล็อกหน้าต่าง Google ให้ใช้อีเมลแทน',
      'auth/unauthorized-domain': 'โดเมนนี้ยังไม่ได้อนุญาตใน Firebase (Authentication → Settings → Authorized domains)',
      'auth/operation-not-allowed': 'ยังไม่ได้เปิดวิธีเข้าสู่ระบบนี้ใน Firebase (Authentication → Sign-in method)',
      'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'ค่า config ของ Firebase ไม่ถูกต้อง', 'permission-denied': 'ไม่มีสิทธิ์ ตรวจกฎ (Rules) ของ Firestore ว่าวางครบแล้ว',
    })[c] || ((e && e.message) || 'ทำรายการไม่สำเร็จ');
  };
  return {
    configured, cfg, start, ensureMember, watchSelf, signUp, signIn, google, reset, signOut, setRole, setName, removeMember, onMembers, memberList, authErr, ensure, assetUrl,
    member: () => member, user: () => user, claude: { use: async (n) => ({ db: DB, user: userApi, assets, downloads }[n] || null) },
  };
})();
window.claude = FB.claude;

</script>

        } else await ref.set(doc);
        old[id] = neu[id];
      }

  C.busy = false;
  if (ok) setSync('synced');

}

  COLS.forEach((c) => {
    C.unsubs.push(DB.collection(c).onSnapshot((snap) => onCol(c, snap), (err) => {

/* ============ attendance model ============ */
const ATT = { p: { t: 'มา', full: 'มาเรียน' }, l: { t: 'สาย', full: 'มาสาย' }, v: { t: 'ลา', full: 'ลา' }, a: { t: 'ขาด', full: 'ขาดเรียน' } };
function attOf(stuId) {
  const r = { p: 0, l: 0, v: 0, a: 0, days: 0, rate: null };
  for (const d in S.att) {
    const c = S.att[d][stuId];
    if (!c) continue;
    r.days++; r[c]++;
  }
  if (r.days) r.rate = Math.round(((r.p + r.l) / r.days) * 100);
  return r;
}
function dayRecorded(date) {
  const day = S.att[date];
  if (!day) return false;
  return roomStudents().some((s) => day[s.id]);
}
function setAtt(stuId, code) {
  if (!CAN_WRITE) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  const date = V.attDate;
  const had = dayRecorded(date);
  const day = S.att[date] || (S.att[date] = {});
  if (!had) roomStudents().forEach((s) => { day[s.id] = 'p'; });
  day[stuId] = code;
  commit(); render();
}
function markAll(code) {
  if (!CAN_WRITE) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  const day = S.att[V.attDate] || (S.att[V.attDate] = {});
  roomStudents().forEach((s) => { day[s.id] = code; });
  commit(); render();
}
function clearDay(date) {
  if (!CAN_WRITE) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  const day = S.att[date];
  if (day) {
    roomStudents().forEach((s) => { delete day[s.id]; });
    if (!Object.keys(day).length) delete S.att[date];
  }
  commit(); closeModal(); render();
}
function roomDates() {
  const ids = new Set(roomStudents().map((s) => s.id));
  const out = [];
  for (const d in S.att) { if (Object.keys(S.att[d]).some((k) => ids.has(k))) out.push(d); }
  return out.sort().reverse();
}

/* ============ ไปห้องน้ำ: จับเวลา + สถิติแบบน่ารัก ============ */
V.wcq = ''; V.wcMode = 'timer'; V.wcRange = '7';
function wcOut(sid) { for (const d in S.trips) for (const id in S.trips[d]) { const t = S.trips[d][id]; if (t.sid === sid && !t.e) return { id, d, s: t.s }; } return null; }
function wcTrips(sids, range) {
  const set = new Set(sids), cut = range === 'all' ? '' : toDateStr(new Date(Date.now() - (range === '1' ? 0 : +range) * 864e5)), out = [];
  for (const d in S.trips) { if (cut && d < cut) continue; for (const id in S.trips[d]) { const t = S.trips[d][id]; if (set.has(t.sid)) out.push({ id, d, sid: t.sid, s: t.s, e: t.e }); } }
  return out;
}
function fmtDur(ms) {
  const s = Math.max(0, Math.round(ms / 1000)), m = Math.floor(s / 60);
  return m ? m + ' นาที' + (s % 60 ? ' ' + (s % 60) + ' วิ' : '') : s + ' วิ';
}
const fmtClock = (ms) => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const clockMS = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function wcStart(sid) {
  if (!CAN_WRITE) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  if (wcOut(sid)) return;
  const d = today(); (S.trips[d] = S.trips[d] || {})[uid('w')] = { sid, s: Date.now(), e: 0 };
  commit(); render(); toast('เดินทางปลอดภัยนะ 🚻 เริ่มจับเวลาแล้ว');
}
function wcBack(sid) {
  const o = wcOut(sid); if (!o || !CAN_WRITE) return;
  const t = S.trips[o.d][o.id]; t.e = Date.now(); const ms = t.e - t.s;
  commit(); render();
  toast((ms < 60000 ? 'เร็วจัง ⚡ ' : ms <= 300000 ? 'กลับมาแล้ว เก่งมาก 🌟 ' : ms <= 600000 ? 'ยินดีต้อนรับกลับ 🐣 ' : 'คิดถึงนะ 🐢 ') + fmtDur(ms));
}
function wcCancel(sid) { const o = wcOut(sid); if (!o || !CAN_WRITE) return; delete S.trips[o.d][o.id]; if (!Object.keys(S.trips[o.d]).length) delete S.trips[o.d]; commit(); render(); toast('ยกเลิกการจับเวลาแล้ว'); }
function wcDelTrip(d, id, sid) { if (!CAN_WRITE || !S.trips[d]) return; delete S.trips[d][id]; if (!Object.keys(S.trips[d]).length) delete S.trips[d]; commit(); openWcStu(sid); render(); }
setInterval(() => { document.querySelectorAll('[data-wc]').forEach((el) => { el.textContent = clockMS(Date.now() - +el.dataset.wc); }); }, 1000);
function wcStatsFor(sid, range) {
  const l = wcTrips([sid], range).filter((t) => t.e), tot = l.reduce((p, t) => p + (t.e - t.s), 0);
  return { n: l.length, tot, avg: l.length ? tot / l.length : 0, max: l.reduce((p, t) => Math.max(p, t.e - t.s), 0), list: l };
}
function wcFace(n, max) { return n === 0 ? '🌵' : n === max && n >= 3 ? '💧' : n >= 4 ? '🌊' : '🫧'; }
function renderWcList() { const l = $('#wc-list'); if (l) l.innerHTML = wcListHTML(roomStudents()); }

function wcStatsHTML(st) {

  const hours = {}; wcTrips(st.map((s) => s.id), rg).forEach((t) => { const h = new Date(t.s).getHours(); hours[h] = (hours[h] || 0) + 1; });
  const hk = Object.keys(hours).sort((a, b) => hours[b] - hours[a])[0];
  const never = rows.filter((r) => !r.n).map((r) => nm(r.s));

function parseStudentLine(raw) {
  let cols = raw.split('\t').map((c) => c.trim()).filter(Boolean);
  if (!cols.length) return null;
  if (cols.length >= 3 && /^\d{1,3}$/.test(cols[0])) cols.shift();
  if (cols.length >= 2 && /\d/.test(cols[0]) && !/[ก-๙]/.test(cols[0])) return { code: cols[0], name: cols.slice(1).join(' ') };
  let l = cols.join(' ').replace(/^\d{1,3}\s*[.)]\s+/, '');
  const m = /^(?=\S*\d)([A-Za-z0-9][A-Za-z0-9\-\/]*)\s+(.+)$/.exec(l);
  return m ? { code: m[1], name: m[2].trim() } : { code: '', name: l };
}

}
async function uploadFile(f) {

}
function uploadMsg(e) {

  if (c === 'unsupported_type') return 'ไฟล์ชนิดนี้แนบไม่ได้';
  if (c === 'quota_or_state') return 'พื้นที่เก็บไฟล์เต็ม ลบใบงานเก่าที่ไม่ใช้แล้วลองใหม่';
  if (c === 'rate_limited') return 'อัปโหลดถี่เกินไป รอสักครู่แล้วลองใหม่';

/* ---- เปิดดู / พิมพ์ไฟล์ใบงานในแอพ ---- */
const WS = { aid: null, zoom: 1, tok: 0 };
function wsKind(f) {

function closeWs() { WS.tok++; const o = document.getElementById('wsview'); if (o) o.remove(); }
function wsZoom(d) { WS.zoom = Math.max(0.5, Math.min(3, WS.zoom + d)); wsRender(); }
function wsFail() {

}
async function wsRender() {
  const a = S.assignments.find((x) => x.id === WS.aid), b = document.getElementById('wsbody'); if (!a || !b) return;
  const f = a.file, k = wsKind(f), tok = ++WS.tok, url = blobUrl(f.id);

    else if (k === 'video') b.innerHTML = `<video controls playsinline src="${url}" style="display:block;max-width:100%;margin:0 auto;background:#000"></video>`;
    else if (k === 'pdf') await wsPdf(url, b, w, tok);
    else { const r = await fetch(url); if (!r.ok) throw new Error('fetch'); const t = await r.text(); if (tok === WS.tok) b.innerHTML = `<pre class="wstxt">${esc(t)}</pre>`; }
  } catch (e) { if (tok === WS.tok) wsFail(); }

let _pdfLib = null; const _pdfDocs = {};
function loadScriptTag(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
async function getPdfLib() {

  await loadScriptTag(base + 'pdf.min.js'); await loadScriptTag(base + 'pdf.worker.min.js');

  if (tok !== WS.tok) return;

  const dpr = Math.min(2, window.devicePixelRatio || 1);

    const pg = await doc.getPage(i); if (tok !== WS.tok) return;

  const sj = subj(), rid = room().id, st = roomStudents(), ro = !canTeach(sj.id);

  const cur = items.find((x) => x.id === V.scId);
  let panel = '';

function setScore(id, sid, raw, max) {
  const x = S.scoreItems.find((i) => i.id === id); if (!x || !guard(x.subjectId)) return;
  const m = S.sc[id] || (S.sc[id] = {});
  if (raw === '' || raw == null) delete m[sid];
  else {
    let v = parseFloat(raw); if (isNaN(v) || v < 0) v = 0; if (v > max) v = max;
    m[sid] = round2(v);
    const inp = document.activeElement; if (inp && inp.tagName === 'INPUT') inp.value = m[sid];
  }
  commit();
}

const CD_SUB = [['แต่งกายไม่เรียบร้อย', 0.5], ['ไม่นำอุปกรณ์การเรียนมา', 0.5], ['รบกวนผู้อื่นขณะเรียน', 0.5], ['พูดจาไม่สุภาพ', 1], ['ใช้โทรศัพท์ในชั้นเรียน', 0.5], ['ออกนอกบริเวณโรงเรียน', 2], ['ทะเลาะวิวาท', 3]]; // มาสาย/ขาด หักอัตโนมัติจากหน้าเช็คชื่อ
const cdN = (x) => String(Math.round(x * 100) / 100);
const cdW = () => { const b = parseFloat(S.settings.conductW); return isFinite(b) && b >= 0 ? b : 10; };
const cdBase = cdW;
const lateN = () => { const n = parseInt(S.settings.lateN, 10); return n >= 1 ? n : 3; };
const absentPts = () => { const n = parseFloat(S.settings.absentPts); return isFinite(n) && n >= 0 ? n : 1; };
/* วันที่เช็คชื่อ -> เทอมไหน (ถ้าไม่ได้ตั้งวันเริ่มเทอม 2 นับทุกวันเป็นเทอมปัจจุบัน) */
function attTerm(d) { const t2 = S.settings.term2Start; return t2 ? (d >= t2 ? 2 : 1) : (S.settings.term || 1); }
function attCounts(sid, term) {
  let l = 0, a = 0;
  for (const d in S.att) { if (attTerm(d) !== term) continue; const x = S.att[d][sid]; if (x === 'l') l++; else if (x === 'a') a++; }
  return { l, a };
}
const cdRecs = (sid, term) => (S.conduct[sid] || []).filter((r) => r.t === term);
function cdTotal(sid, term) {
  let add = 0, sub = 0; const rs = cdRecs(sid, term), ac = attCounts(sid, term);
  rs.forEach((r) => { if (r.p >= 0) add += r.p; else sub += -r.p; });
  const att = Math.floor(ac.l / lateN()) + ac.a * absentPts(), base = cdW();
  return { add, sub, att, late: ac.l, absent: ac.a, n: rs.length, total: Math.round(Math.min(base, Math.max(0, base + add - sub - att)) * 100) / 100 };

function cdLevel(total) { const b = cdBase(); if (!b) return 'n'; const p = total / b * 100; return p >= 80 ? 'p' : p >= 60 ? 'l' : 'a'; }

      ${CAN_WRITE && st.length ? `<button class="btn soft s" onclick="openCd(null,'sub')">${ic('users', 16)} บันทึกหลายคน</button>` : ''}</div>
    ${termChips()}
    ${st.length ? `<div class="card">${stuSearchBox('cd')}<div data-sf="cd">${rows}</div></div>` : `<div class="card empty">${ic('users', 28)}<div>ยังไม่มีนักเรียนในห้องนี้</div><div class="btnrow" style="justify-content:center"><button class="btn primary" style="flex:none" onclick="openAddStudents()">เพิ่มนักเรียน</button></div></div>`}

function vStats() {
  const st = roomStudents(), rid = room().id;
  const att = st.map((s) => ({ s, a: attOf(s.id) }));
  const missing = st.map((s) => {
    let n = 0;
    S.assignments.filter((a) => a.roomId === rid).forEach((a) => { if (!(S.asg[a.id] && S.asg[a.id][s.id] && S.asg[a.id][s.id].d)) n++; });

  const low = att.filter((x) => x.a.rate != null && x.a.rate < 80).sort((a, b) => a.a.rate - b.a.rate).slice(0, 5);

  const subjRows = roomSubs(rid).map((sj) => {
    const asgs = S.assignments.filter((a) => a.roomId === rid && a.subjectId === sj.id);
    const slots = asgs.length * st.length;

    asgs.forEach((a) => st.forEach((s) => { if (S.asg[a.id] && S.asg[a.id][s.id] && S.asg[a.id][s.id].d) sub++; }));
    const sp = slots ? Math.round((sub / slots) * 100) : null;
    let got = 0, poss = 0;
    S.scoreItems.filter((x) => x.roomId === rid && x.subjectId === sj.id).forEach((x) => st.forEach((s) => { const v = S.sc[x.id] && S.sc[x.id][s.id]; if (num(v)) { got += v; poss += x.max; } }));
    const ap = poss ? Math.round((got / poss) * 100) : null;
    return `<div class="srow"><div class="row between"><span class="row"><span class="sico c-${sj.color}">${ic(sj.icon, 14)}</span><b>${esc(sj.name)}</b></span><span class="pill n">คะแนนเฉลี่ย ${ap == null ? '–' : ap + '%'}</span></div>

  }).join('');

  return `<div class="pagehead"><div><h2 class="h2">สถิติและภาพรวม</h2><p class="sm muted">ห้อง ${esc(room().name)} · ${st.length} คน</p></div></div>

      <div class="sect"><div class="sm muted" style="margin-bottom:6px">เข้าเรียนต่ำกว่า 80%</div>${low.length ? low.map((x) => `<div class="row between" style="padding:6px 0;border-bottom:1px dashed var(--line)"><span class="trunc">${esc(x.s.name)}</span><span class="pill a">${x.a.rate}% · ขาด ${x.a.a} สาย ${x.a.l}</span></div>`).join('') : '<div class="sm muted">ยังไม่มีใครต่ำกว่าเกณฑ์</div>'}</div>
    </div>
    <div class="card"><div class="row between wrapx"><h3 class="h3">การเข้าเรียนรายบุคคล</h3><span class="pill n">${roomDates().length} วันที่เช็คชื่อ</span></div>
      <div style="margin-top:10px">${att.length ? att.map((x) => `<div class="srow"><div class="row between"><span class="row" style="min-width:0"><div class="avatar sm2">${avatarSVG(x.s.avatar)}</div><b class="trunc">${esc(x.s.name)}</b></span><span class="rate">${x.a.rate == null ? '–' : x.a.rate + '%'}</span></div>
        <div class="mini"><span>มา <b class="p">${x.a.p}</b></span><span>สาย <b class="l">${x.a.l}</b></span><span>ลา <b class="v">${x.a.v}</b></span><span>ขาด <b class="a">${x.a.a}</b></span></div></div>`).join('') : '<div class="empty">ยังไม่มีนักเรียน</div>'}</div></div>

/* ============ grades: คำนวณเกรดอัตโนมัติ ============ */
function collectItems(rid, sid, term) {
  const out = [];
  S.assignments.forEach((a) => { if (a.roomId === rid && a.subjectId === sid && a.term === term) out.push({ k: 'a', id: a.id, max: a.max, title: a.title }); });
  S.scoreItems.forEach((x) => { if (x.roomId === rid && x.subjectId === sid && x.term === term && x.kind !== 'exam') out.push({ k: 's', id: x.id, max: x.max, title: x.title }); });
  return out;
}
const examItem = (rid, sid, term) => S.scoreItems.find((x) => x.roomId === rid && x.subjectId === sid && x.term === term && x.kind === 'exam');
function markVal(item, stuId) {
  return item.k === 'a' ? (S.asg[item.id] && S.asg[item.id][stuId] && S.asg[item.id][stuId].p) : (S.sc[item.id] && S.sc[item.id][stuId]);
}
/* ตัดเกรดตามช่วงคะแนนในหน้าตั้งค่า */
function gradeOfPct(p) {
  const sc = S.settings.scale.slice().sort((a, b) => b[0] - a[0]);
  for (const r of sc) if (p >= r[0]) return r[1];
  return 0;
}
/* งานที่ยังค้าง (ไม่ติ๊กส่ง) ของนักเรียนในวิชา/เทอม — ใช้เตือนข้างเกรด ไม่เปลี่ยนเกรด */
function owedN(rid, sid, subId, term) {
  return S.assignments.filter((a) => a.roomId === rid && a.subjectId === subId && (term == null || a.term === term) && !(S.asg[a.id] && S.asg[a.id][sid] && S.asg[a.id][sid].d)).length;
}
const owedTag = (n, g) => (n && g != null ? `<sup style="color:#c0392b;font-weight:700;white-space:nowrap"> *ค้าง ${n}</sup>` : '');
const fmtG = (g) => (g == null ? '–' : String(Math.round(g * 10) / 10));
/* รายการคะแนนเก็บที่ "มีผลแล้ว" (มีนักเรียนอย่างน้อย 1 คนมีคะแนน) ช่องว่างของรายการนั้นนับเป็น 0 */
function termCtx(rid, sid, term) {
  const sub = S.subjects.find((x) => x.id === sid) || NO_SUBJ;
  const stu = S.students.filter((s) => s.roomId === rid);
  const items = collectItems(rid, sid, term).filter((it) => stu.some((s) => num(markVal(it, s.id))));
  const ex = examItem(rid, sid, term);
  const exGraded = ex && stu.some((s) => num(S.sc[ex.id] && S.sc[ex.id][s.id]));
  return { sub, term, items, collMax: items.reduce((p, c) => p + c.max, 0), ex: exGraded ? ex : null };
}
function ctxOf(rid, sid, term) { const k = rid + '|' + sid + '|' + term; return CTX[k] || (CTX[k] = termCtx(rid, sid, term)); }
function calcStudent(ctx, stuId) {
  const w1 = ctx.sub.collectW, w2 = ctx.sub.examW;
  const cwE = Math.min(cdW(), w1), wWork = w1 - cwE; // คะแนนเก็บ = งาน (w1 − จิตพิสัย) + จิตพิสัย (เกณฑ์เดียวกันทุกวิชา)

function pickLogo(inp) {
  const f = inp.files && inp.files[0]; inp.value = '';
  if (!f || !isAdmin()) return;
  if (!/^image\//.test(f.type)) { toast('เลือกไฟล์รูปภาพเท่านั้น'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      let max = 240, url = '', cleaned = false;
      for (let i = 0; i < 4; i++) {
        const k = Math.min(1, max / Math.max(img.width || 1, img.height || 1)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round((img.width || 1) * k)); c.height = Math.max(1, Math.round((img.height || 1) * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const lc = logoClean(c); cleaned = lc.changed; url = lc.canvas.toDataURL('image/png');
        if (url.length < 120000) break;
        max = Math.round(max * 0.7);
      }
      if (url.length >= 120000) { toast('รูปโลโก้ซับซ้อนเกินไป ลองใช้รูปที่เรียบกว่านี้'); return; }
      S.settings.logo = url; commit(); render(); toast(cleaned ? 'ตั้งโลโก้แล้ว (ลบพื้นหลังให้แล้ว)' : 'ตั้งโลโก้แล้ว');
    };
    img.onerror = () => toast('อ่านรูปไม่สำเร็จ');
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
/* ---- ลบพื้นหลังโลโก้ (ลบเฉพาะพื้นที่สีพื้นที่ติดขอบรูป ไม่ลบสีขาวที่อยู่ในตัวโลโก้) ---- */
function logoClean(c) {
  const w = c.width, h = c.height, x = c.getContext('2d', { willReadFrequently: true }), d = x.getImageData(0, 0, w, h), px = d.data;
  for (let p = 3; p < px.length; p += 4) { if (px[p] < 250) return { canvas: c, changed: false }; }
  const at = (i) => [px[i * 4], px[i * 4 + 1], px[i * 4 + 2]];
  const cs = [at(0), at(w - 1), at((h - 1) * w), at(h * w - 1)];
  const bg = [0, 1, 2].map((k) => Math.round(cs.reduce((s, v) => s + v[k], 0) / 4));
  const dist = (i) => Math.max(Math.abs(px[i * 4] - bg[0]), Math.abs(px[i * 4 + 1] - bg[1]), Math.abs(px[i * 4 + 2] - bg[2]));
  const TOL = 42, seen = new Uint8Array(w * h), st = [];
  const push = (i) => { if (!seen[i] && dist(i) <= TOL) { seen[i] = 1; st.push(i); } };
  for (let xx = 0; xx < w; xx++) { push(xx); push((h - 1) * w + xx); }
  for (let yy = 0; yy < h; yy++) { push(yy * w); push(yy * w + w - 1); }
  while (st.length) {
    const i = st.pop(), xx = i % w, yy = (i - xx) / w;
    if (xx > 0) push(i - 1); if (xx < w - 1) push(i + 1); if (yy > 0) push(i - w); if (yy < h - 1) push(i + w);
  }
  let n = 0;
  for (let i = 0; i < w * h; i++) if (seen[i]) { px[i * 4 + 3] = 0; n++; }
  if (n < w * h * 0.02) return { canvas: c, changed: false };
  for (let i = 0; i < w * h; i++) { // ลบขอบแข็งให้นุ่มขึ้น
    if (seen[i]) continue;
    const xx = i % w, yy = (i - xx) / w;
    if ((xx > 0 && seen[i - 1]) || (xx < w - 1 && seen[i + 1]) || (yy > 0 && seen[i - w]) || (yy < h - 1 && seen[i + w])) {
      const dd = dist(i); if (dd < TOL * 2.2) px[i * 4 + 3] = Math.round(255 * Math.max(0.25, (dd - TOL) / (TOL * 1.2)));
    }
  }
  x.putImageData(d, 0, 0);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) if (px[(yy * w + xx) * 4 + 3] > 12) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
  if (x1 < 0) return { canvas: c, changed: false };
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return { canvas: o, changed: true };
}

    S.settings.logo = r.canvas.toDataURL('image/png'); commit(); render(); toast('ลบพื้นหลังโลโก้แล้ว');

    const im = await loadImgFile(f), k = Math.min(1, 700 / Math.max(im.width, im.height, 1));
    let c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    let x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
    let opaque = true;
    for (let p = 3; p < px.length; p += 4) { if (px[p] < 250) { opaque = false; break; } }
    if (opaque) {
      for (let p = 0; p < px.length; p += 4) {
        const lum = 0.299 * px[p] + 0.587 * px[p + 1] + 0.114 * px[p + 2];
        px[p + 3] = lum >= 238 ? 0 : lum <= 170 ? 255 : Math.round(255 * (238 - lum) / 68);
      }
      x.putImageData(d, 0, 0);
    }
    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (let yy = 0; yy < c.height; yy++) for (let xx = 0; xx < c.width; xx++) { if (px[(yy * c.width + xx) * 4 + 3] > 12) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; } }
    if (x1 < 0) { toast('ไม่พบลายเซ็นในรูป ลองรูปที่ชัดกว่านี้'); return; }
    const pad = 4; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width - 1, x1 + pad); y1 = Math.min(c.height - 1, y1 + pad);
    const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
    o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
    const blob = await new Promise((r) => o.toBlob(r, 'image/png'));
    if (!blob) throw new Error('blob');
    const as = await window.claude.use('assets');
    if (!as) { toast('บัญชีนี้อัปโหลดรูปไม่ได้ (ต้องเป็นผู้ดูแลหรือครูผู้สอน)'); return; }
    const r = await as.upload(new File([blob], 'signature.png', { type: 'image/png' }), { type: 'image/png' });
    const old = S.settings.sign[i].img;
    S.settings.sign[i].img = r.id; commit(); render();
    toast(opaque ? 'ตั้งลายเซ็นแล้ว (ทำพื้นขาวให้โปร่งใสให้แล้ว)' : 'ตั้งลายเซ็นแล้ว');
    dropSignAsset(old);
  } catch (e) { toast(e && e.code ? uploadMsg(e) : 'อ่านรูปไม่สำเร็จ ลองรูปอื่น'); }
}

function saveSubject(id) {

  const credit = parseFloat($('#sj-credit').value), cw = parseFloat($('#sj-cw').value), ew = parseFloat($('#sj-ew').value);
  if (!(credit > 0)) { $('#sj-err').textContent = 'หน่วยกิตต้องมากกว่า 0'; return; }
  if (isNaN(cw) || isNaN(ew) || cw < 0 || ew < 0 || cw + ew <= 0) { $('#sj-err').textContent = 'สัดส่วนคะแนนเก็บและสอบต้องเป็นตัวเลขที่รวมมากกว่า 0'; return; }

  if (x) { x.name = n; x.credit = credit; x.collectW = cw; x.examW = ew; }
  else {
    const chk = document.querySelector('input[name=sj-ic]:checked');
    x = { id: uid('j'), name: n, icon: chk ? chk.value : 'book', color: SUBJECT_COLORS[S.subjects.length % SUBJECT_COLORS.length], credit, collectW: cw, examW: ew };

  }
  S.subjectTeachers[x.id] = tids;
  if (!tids.length) delete S.subjectTeachers[x.id];

}

/* ============ export / backup ============ */
async function saveFile(name, data) {
  let dl = null;
  try { dl = await window.claude.use('downloads'); } catch (e) { /* ignore */ }
  if (!dl) { toast('ดาวน์โหลดไฟล์ไม่ได้ ลองใหม่อีกครั้ง'); return false; }
  try { await dl.save({ filename: name, data }); return true; }
  catch (e) { if (!(e && e.code === 'declined')) toast('บันทึกไฟล์ไม่สำเร็จ'); return false; }
}
function sheetName(name, used) {
  let n = name.replace(/[\\\/?*\[\]:]/g, '_').slice(0, 31) || 'Sheet';
  const base = n; let i = 2;
  while (used.has(n.toLowerCase())) { n = base.slice(0, 28) + '_' + i++; }
  used.add(n.toLowerCase());
  return n;
}
function gradeSheet(gt) {
  const rid = room().id;
  return roomStudents().map((s, i) => {
    const r = { 'ลำดับ': i + 1, 'รหัสนักเรียน': s.code, 'ชื่อ-นามสกุล': s.name }, list = [];
    roomSubs(rid).forEach((sub) => {
      if (gt === 'y') {
        const y = yearResult(rid, sub, s.id); list.push({ grade: y.grade, credit: sub.credit });
        r[sub.name + ' เทอม1'] = y.a.total == null ? '' : y.a.total; r[sub.name + ' เทอม2'] = y.b.total == null ? '' : y.b.total;
        r[sub.name + ' เฉลี่ย%'] = y.pct == null ? '' : y.pct; r[sub.name + ' เกรด'] = y.grade == null ? '' : y.grade;
      } else {
        const t = termResult(rid, sub, s.id, gt); list.push({ grade: t.grade, credit: sub.credit });
        r[sub.name + ' เก็บ'] = t.collScore == null ? '' : t.collScore; r[sub.name + ' สอบ'] = t.examScore == null ? '' : t.examScore;
        r[sub.name + ' รวม'] = t.total == null ? '' : t.total; r[sub.name + ' เกรด'] = t.grade == null ? '' : t.grade;
      }
    });
    const gp = gpaOf(list); r['GPA'] = gp == null ? '' : gp;
    return r;
  });
}
async function exportXlsx() {

    const add = (rows, name) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName(name, used));
    add(gradeSheet(1), 'ใบเกรดเทอม1'); add(gradeSheet(2), 'ใบเกรดเทอม2'); add(gradeSheet('y'), 'ใบเกรดทั้งปี');

    add(st.map((s, i) => { const a = attOf(s.id); return { 'ลำดับ': i + 1, 'รหัสนักเรียน': s.code, 'ชื่อ-นามสกุล': s.name, 'ชั้น': rname, 'จำนวนวันที่เช็คชื่อ': a.days, 'มาเรียน': a.p, 'มาสาย': a.l, 'ลา': a.v, 'ขาดเรียน': a.a, 'อัตราการเข้าเรียน (%)': a.rate == null ? '' : a.rate }; }), 'สรุปการเข้าเรียน');
    const dates = roomDates().slice().reverse();
    if (dates.length) {
      const code = { p: 'ม', l: 'ส', v: 'ล', a: 'ข' };
      add(st.map((s, i) => { const r = { 'ลำดับ': i + 1, 'รหัสนักเรียน': s.code, 'ชื่อ-นามสกุล': s.name }; dates.forEach((d) => { r[fmtDate(d)] = (S.att[d] && S.att[d][s.id]) ? code[S.att[d][s.id]] : ''; }); return r; }), 'เช็คชื่อรายวัน (ม ส ล ข)');
    }
    roomSubs(rid).forEach((sj) => TERMS.forEach((term) => {
      const cols = collectItems(rid, sj.id, term), ex = examItem(rid, sj.id, term);
      const all = cols.concat(ex ? [{ k: 's', id: ex.id, title: ex.title + ' (สอบ)', max: ex.max }] : []);
      if (!all.length) return;
      add(st.map((s, i) => {
        const r = { 'ลำดับ': i + 1, 'รหัสนักเรียน': s.code, 'ชื่อ-นามสกุล': s.name };
        all.forEach((c) => { const v = markVal(c, s.id); r[c.title + ' (เต็ม ' + c.max + ')'] = num(v) ? v : ''; });
        return r;
      }), sj.name + ' ท' + term);
    }));

    if (await saveFile('ABDIA_' + rname.replace(/[\\\/:*?"<>|]/g, '-') + '_' + today() + '.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }))) toast('บันทึกไฟล์ Excel แล้ว');
  } catch (e) { console.warn(e); toast('ส่งออกไม่สำเร็จ ลองอีกครั้งนะคะ'); }
}

function importBackup(input) {
  const f = input.files && input.files[0]; input.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o || !Array.isArray(o.rooms) || !Array.isArray(o.students)) throw new Error('bad');
      window._pendingRestore = o;
      askConfirm('นำเข้าไฟล์สำรอง', 'ข้อมูลในฐานข้อมูลกลางจะถูกแทนที่ด้วยข้อมูลจากไฟล์ (' + o.students.length + ' นักเรียน, ' + o.rooms.length + ' ห้อง) ครูทุกคนจะเห็นข้อมูลใหม่', 'doRestore()', 'นำเข้า');
    } catch (e) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอพนี้'); }
  };
  rd.readAsText(f);
}
function doRestore() {
  const o = window._pendingRestore; window._pendingRestore = null;
  if (!o || !isAdmin()) return;
  const n = freshState();
  n.me = S.me; n.profiles = S.profiles; n.subjectTeachers = o.subjectTeachers || S.subjectTeachers;
  n.rooms = o.rooms || [];
  n.subjects = (o.subjects || []).map((x) => Object.assign({ icon: 'book', color: 'green', credit: 1, collectW: 70, examW: 30 }, x));
  n.students = (o.students || []).map((s) => Object.assign({ code: '', avatar: 'girl' }, s));
  n.assignments = (o.assignments || []).map((a) => Object.assign({ term: 1, link: '', due: '' }, a));
  n.scoreItems = (o.scoreItems || []).map((x) => Object.assign({ term: 1, kind: 'item' }, x));
  n.asg = o.asg || {}; n.sc = o.sc || {}; n.att = o.att || {}; n.conduct = o.conduct || {}; n.trips = o.trips || {}; n.incidents = o.incidents || {};
  n.settings = Object.assign(n.settings, o.settings || {});

  commit(); closeModal(); render(); toast('นำเข้าข้อมูลแล้ว กำลังบันทึกขึ้นฐานข้อมูล');

/* ============ modal / toast / confirm ============ */
let _confirmFn = null;
function modal(html, focusId) {
  $('#modalbox').innerHTML = html;
  $('#modal').hidden = false;
  if (focusId) { const el = document.getElementById(focusId); if (el) setTimeout(() => el.focus(), 30); }
}
function closeModal() { $('#modal').hidden = true; $('#modalbox').innerHTML = ''; _confirmFn = null; }
function askConfirm(title, text, fnCall, okLabel) {
  _confirmFn = fnCall;
  const danger = !okLabel;
  modal(`<div style="text-align:center;padding:6px 2px">
    <div style="color:${danger ? 'var(--a)' : 'var(--sage-d)'};margin-bottom:6px">${ic(danger ? 'warn' : 'check', 32)}</div>
    <h3 class="h3">${esc(title)}</h3><p class="sm muted" style="margin-top:6px">${esc(text)}</p>
    <div class="btnrow"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn ${danger ? 'danger' : 'primary'}" onclick="runConfirm()">${esc(okLabel || 'ลบ')}</button></div></div>`);
}
function runConfirm() {
  const f = _confirmFn; _confirmFn = null;
  const m = f && /^(\w+)\((?:'([^']*)')?\)$/.exec(f);
  if (m && typeof window[m[1]] === 'function') window[m[1]](m[2]);
}
let _tt = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(_tt); _tt = setTimeout(() => { t.hidden = true; }, 3200);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
$('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });

function saveSlide(key, id) {
  const [rid, sid] = key.split('~'); if (!guard(sid)) return;

  const l = S.slides[key] = S.slides[key] || [], x = id ? l.find((v) => v.id === id) : null;
  if (x) { const chg = x.url !== url || x.title !== title || x.d !== d; Object.assign(x, { title, url, d, t: attTerm(d), note }); if (chg) { x.ok = false; x.okBy = ''; x.okAt = 0; } }
  else l.push({ id: uid('l'), t: attTerm(d), d, title, url, note, by: MEID, at: Date.now(), ok: false, okBy: '', okAt: 0 });
  if (!x) pushEvent('slide-new', { room: roomNameOf(rid), subject: ((S.subjects.find((v) => v.id === sid) || {}).name || ''), title });

}

/* หน้าต้อนรับ: แสดงทุกครั้งที่เปิดแอพ รวมถึงตอนกลับมาเปิดจากหน้าจอโฮม/พื้นหลัง (หลังพักไว้เกิน 1 นาที) */
let _hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { _hiddenAt = Date.now(); return; }

  const away = Date.now() - _hiddenAt; _hiddenAt = 0;
  try { navigator.serviceWorker && navigator.serviceWorker.getRegistration().then((r) => r && r.update()); } catch (e) { /* ignore */ }
